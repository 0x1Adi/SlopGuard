require:
  - rubocop-rspec

AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'bin/**/*'

# Layout & Formatting
Layout/LineLength:
  Max: 120
  Exclude:
    - 'spec/**/*'

Layout/HashAlignment:
  EnforcedHashRocketStyle: table
  EnforcedColonStyle: table

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/FirstHashElementIndentation:
  EnforcedStyle: consistent

# Metrics - Be realistic about complexity
Metrics/MethodLength:
  Max: 25
  Exclude:
    - 'spec/**/*'

Metrics/AbcSize:
  Max: 25
  Exclude:
    - 'spec/**/*'

Metrics/ClassLength:
  Max: 200
  Exclude:
    - 'spec/**/*'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - '*.gemspec'

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

# Style
Style/Documentation:
  Enabled: false  # Don't require class documentation for every class

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: brackets

Style/HashSyntax:
  EnforcedStyle: ruby19
  EnforcedShorthandSyntax: either

Style/ClassAndModuleChildren:
  Enabled: false  # Allow nested modules

Style/GuardClause:
  Enabled: true
  MinBodyLength: 3

# Naming
Naming/MethodParameterName:
  AllowedNames:
    - e   # exception
    - i   # index
    - j   # index
    - k   # key
    - v   # value
    - t   # time
    - m   # match
    - n   # count

# Lint
Lint/SuppressedException:
  AllowComments: true

# Security
Security/Open:
  Enabled: true

RSpec/NestedGroups:
  Max: 4

RSpec/DescribeClass:
  Exclude:
    - 'spec/e2e_*.rb'

RSpec/MultipleExpectations:
  Max: 10  # E2E tests verify full workflows
  Exclude:
    - 'spec/e2e_*.rb'

RSpec/ExampleLength:
  Max: 30  # Integration tests are longer
  Exclude:
    - 'spec/e2e_*.rb'

RSpec/SpecFilePathFormat:
  Enabled: false  # Your structure is fine